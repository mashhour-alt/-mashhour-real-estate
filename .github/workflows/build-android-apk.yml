name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create --platforms=android --project-name carpet_shop_manager --org com.mashhour.carpet .
      - name: Remove generated sample test if present
        run: rm -f test/widget_test.dart
      - name: Install packages
        run: flutter pub get
      - name: Check source
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build installable release APK
        run: flutter build apk --release
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk carpet-shop-manager.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: carpet-shop-manager-android
          path: carpet-shop-manager.apk
          if-no-files-found: error
          retention-days: 30
