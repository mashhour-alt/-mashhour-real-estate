name: Build iOS Simulator App

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-ios-simulator.yml'

permissions:
  contents: read

jobs:
  build-ios-simulator:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS project files
        run: flutter create --platforms=ios --project-name carpet_shop_manager --org com.mashhour.carpet .

      - name: Remove generated sample test if present
        run: rm -f test/widget_test.dart

      - name: Install packages and test
        run: |
          flutter pub get
          flutter test

      - name: Build iOS Simulator app
        run: flutter build ios --simulator --debug

      - name: Package Runner.app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app carpet-shop-manager-ios-simulator.zip

      - name: Upload iOS simulator build
        uses: actions/upload-artifact@v4
        with:
          name: carpet-shop-manager-ios-simulator
          path: carpet-shop-manager-ios-simulator.zip
          if-no-files-found: error
          retention-days: 30
